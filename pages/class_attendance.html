<div class="shadow-sm border rounded my-2">
  <div
    class="d-flex align-items-center justify-content-between w-100 p-2 px-3 fs-6 fw-bold"
  >
    <div class="d-flex align-items-center gap-2">
      <a
        class="d-flex gap-2 d-xl-none btn btn-sm"
        data-bs-toggle="offcanvas"
        href="#sidebar"
        role="button"
        aria-controls="sidebar"
      >
        <img
          src="../assets/icons/burger_menu.svg"
          alt="menu"
          style="width: 20px"
        />
      </a>
      <div class="fs-6 fw-bold secondary-text-color">Class Attendance</div>
    </div>

    <div class="text-center p-1 rounded-circle">
      <img src="../assets/sample_logo.png" alt="Logo" style="max-width: 50px" />
    </div>
  </div>
</div>
<div class="border p-3 shadow-sm mt-4 rounded">
  <span class="">SY-Term</span>

  <div class="row g-3 align-items-center">
    <div class="col-sm-12 col-md-12 col-lg-3 col-xl-3">
      <div class="form-floating">
        <input
          type="text"
          class="form-control"
          id="starting_year"
          placeholder="Starting year"
        />
        <label for="starting_year">Year</label>
      </div>
    </div>

    <div class="col-sm-12 col-md-12 col-lg-3 col-xl-3">
      <div class="form-floating">
        <select name="" id="" class="form-select">
          <option value="">Select School Term</option>
          <option value="">1st Sem</option>
          <option value="">2nd Sem</option>
          <option value="">3rd Sem</option>
          <option value="">Summer</option>
        </select>
        <label for="starting_year">Term:</label>
      </div>
    </div>

    <div class="col-sm-12 col-md-12 col-lg-2 col-xl-2">
      <button class="btn btn-sm primary-btn w-100 h-100">Refresh</button>
    </div>
  </div>

  <div class="rounded h-100 mt-4">
    <h5 class="text-dark fw-bold">Attendance Sheet</h5>
    <div class="text-dark align-self-end py-3 text-end">
      Total Days of Attendance:
    </div>
    <div style="max-height: 350px; overflow-y: auto">
      <div class="table-responsive">
        <table class="table table-sm table-striped table-hover table-fixed">
          <thead>
            <tr>
              <th style="width: 120px">Subject Code</th>
              <th style="width: 300px">Subject Title</th>
              <th style="width: 120px">Total Absence</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>ITCOM 401A</td>
              <td>IT Software (Capstone) Project 2</td>
              <td>Not encoded</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
