<div class="shadow-sm border rounded bg-light my-2">
  <div class="d-flex p-2 px-3 justify-content-between align-items-center secondary-text-color fs-5 fw-bold">
    <div class="d-flex gap-2">
      <a
        class="d-block d-lg-none btn btn-sm"
        data-bs-toggle="offcanvas"
        href="#sidebar"
        role="button"
        aria-controls="sidebar"
        style="width: 40px; height: 40px"
      >
        <img
          src="../assets/icons/burger_menu.svg"
          alt="menu"
          style="width: 20px; height: 20px"
        />
      </a>
      Campus Attendance
    </div>
    <div class="text-center p-1 bg-light rounded-circle">
      <img src="../assets/sample_logo.png" alt="Logo" style="max-width: 50px" />
    </div>
  </div>
</div>

<div class="border p-3 shadow-sm mt-4 rounded">
  <div class="fw-bold fs-5 mb-3">No Result Found</div>

  <!-- Filter Options -->
  <div class="d-flex gap-3 w-50">
    <div class="d-flex w-50">
      <div class="form-check form-check-inline">
        <input
          class="form-check-input"
          type="radio"
          name="filter_type"
          id="date_range"
          value="date_range"
          checked
        />
        <label class="form-check-label" for="date_range">Date Range</label>
      </div>
      <div class="form-check form-check-inline">
        <input
          class="form-check-input"
          type="radio"
          name="filter_type"
          id="school_year"
          value="school_year"
        />
        <label class="form-check-label" for="school_year">School Year</label>
      </div>
    </div>
  </div>

  <!-- Date Range / School Year Selection -->
  <div class="mt-3">
    <div class="d-flex align-items-center gap-2 w-50 mb-4">
      <div class="d-flex gap-2" id="radio_date_range">
        <div class="form-floating w-100">
          <input
            type="date"
            class="form-control"
            id="start_date"
            placeholder="Starting year"
          />
          <label for="start_date">From:</label>
        </div>
        <span class="my-auto">-</span>
        <div class="form-floating w-100">
          <input
            type="date"
            class="form-control"
            id="end_date"
            placeholder="Ending year"
          />
          <label for="end_date">To:</label>
        </div>
      </div>

      <div class="form-floating">
        <input
          type="date"
          class="form-control"
          id="year_date"
          placeholder="Year"
        />
        <label for="year_date">Year</label>
      </div>

      <button class="btn btn-sm primary-btn w-25 ms-5">Refresh</button>
    </div>

    <!-- Schedule Table -->
    <div class="border p-3 shadow-sm rounded h-100">
      <h5 class="text-dark fw-bold">Attendance Report</h5>
      <div style="max-height: 350px; overflow-y: auto">
        <div class="table-responsive">
          <table class="table table-sm table-striped table-hover table-fixed">
            <thead>
              <tr>
                <th style="width: 80px">Count</th>
                <th style="width: 130px">Date</th>
                <th style="width: 130px">Time In</th>
                <th style="width: 180px">Time In Location</th>
                <th style="width: 130px">Time Out</th>
                <th style="width: 180px">Time Out Location</th>
                <th style="width: 200px">Fetched By</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>1</td>
                <td>09/21/2022</td>
                <td>05:52:17 PM</td>
                <td>HTM</td>
                <td>07:37:41 PM</td>
                <td>GALO GATE</td>
                <td></td>
              </tr>
              <tr>
                <td>2</td>
                <td>09/22/2022</td>
                <td>MW 4:00PM-5:30PM</td>
                <td>RIZAL GATE</td>
                <td>07:32:38 PM</td>
                <td>GALO GATE</td>
                <td></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- jQuery -->
<script src="../jquery/jquery.js"></script>

  $(document).ready(function () {
    console.log("jQuery is working!");
  });
</script>
