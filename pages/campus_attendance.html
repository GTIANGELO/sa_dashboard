<div class="shadow-sm border rounded my-2">
  <div
    class="d-flex align-items-center justify-content-between w-100 p-2 px-3 fs-6 fw-bold"
  >
    <div class="d-flex align-items-center gap-2">
      <a
        class="d-flex gap-2 d-xl-none btn btn-sm"
        data-bs-toggle="offcanvas"
        href="#sidebar"
        role="button"
        aria-controls="sidebar"
      >
        <img
          src="../assets/icons/burger_menu.svg"
          alt="menu"
          style="width: 20px"
        />
      </a>
      <div class="fs-6 fw-bold secondary-text-color">Campus Attendance</div>
    </div>

    <div class="text-center p-1 rounded-circle">
      <img src="../assets/sample_logo.png" alt="Logo" style="max-width: 50px" />
    </div>
  </div>
</div>

<div class="border p-3 shadow-sm mt-4 rounded">
  <div class="fw-bold fs-5 mb-3">No Result Found</div>

  <!-- Filter Options -->
<div class="d-flex gap-3 w-100">
  <div class="d-flex w-100">
    <div class="form-check form-check-inline">
      <input
        class="form-check-input"
        type="radio"
        name="filter_type"
        id="date_range"
        value="date_range"
        checked
      />
      <label class="form-check-label" for="date_range">Date Range</label>
    </div>
    <div class="form-check form-check-inline">
      <input
        class="form-check-input"
        type="radio"
        name="filter_type"
        id="school_year"
        value="school_year"
      />
      <label class="form-check-label" for="school_year">School Year</label>
    </div>
  </div>
</div>

<!-- Date Range / School Year Selection -->
<div class="mt-3">
  <div class="d-flex align-items-center gap-2 w-100 mb-4">
    <div class="d-grid d-md-flex gap-2 w-50" id="radio_date_range">
      
      <!-- Parent for From–To -->
      <div class="d-flex gap-2 w-50 date-range-group">
        <div class="form-floating w-100">
          <input
            type="date"
            class="form-control form-control-sm"
            id="start_date"
            placeholder="Starting year"
          />
          <label for="start_date">From:</label>
        </div>
        <span class="d-none d-lg-flex my-auto">-</span>
        <div class="form-floating w-100">
          <input
            type="date"
            class="form-control form-control-sm"
            id="end_date"
            placeholder="Ending year"
          />
          <label for="end_date">To:</label>
        </div>
      </div>

      <!-- Year -->
      <div class="form-floating w-50 year-field d-none">
        <input
          type="year"
          class="form-control form-control-sm"
          id="year_date"
          placeholder="Year"
        />
        <label for="year_date">Year</label>
      </div>

      <button class="btn btn-sm primary-btn w-25 m-auto">Refresh</button>
    </div>
  </div>
</div>

    <!-- Schedule Table -->
    <div class="h-100">
      <h5 class="text-dark fw-bold">Attendance Report</h5>
      <div style="max-height: 350px; overflow-y: auto">
        <div class="table-responsive">
          <table class="table table-sm table-striped table-hover table-fixed">
            <thead>
              <tr>
                <th style="width: 80px">Count</th>
                <th style="width: 130px">Date</th>
                <th style="width: 130px">Time In</th>
                <th style="width: 180px">Time In Location</th>
                <th style="width: 130px">Time Out</th>
                <th style="width: 180px">Time Out Location</th>
                <th style="width: 200px">Fetched By</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>1</td>
                <td>09/21/2022</td>
                <td>05:52:17 PM</td>
                <td>HTM</td>
                <td>07:37:41 PM</td>
                <td>GALO GATE</td>
                <td></td>
              </tr>
              <tr>
                <td>2</td>
                <td>09/22/2022</td>
                <td>MW 4:00PM-5:30PM</td>
                <td>RIZAL GATE</td>
                <td>07:32:38 PM</td>
                <td>GALO GATE</td>
                <td></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- jQuery -->
<script src="../jquery/jquery.js"></script>
<script>
  $(document).ready(function () {
    $('input[name="filter_type"]').change(function () {
      if ($(this).val() === "date_range") {
        // Show the Date Range group and hide Year
        $(".date-range-group").removeClass("d-none");
        $(".year-field").addClass("d-none");
      } else if ($(this).val() === "school_year") {
        // Show Year and hide the Date Range group
        $(".year-field").removeClass("d-none");
        $(".date-range-group").addClass("d-none");
      }
    });
  });
</script>
