<div class="shadow-sm border rounded my-2">
  <div
    class="d-flex align-items-center justify-content-between w-100 p-2 px-3 fs-6 fw-bold"
  >
    <div class="d-flex align-items-center gap-2">
      <a
        class="d-flex gap-2 d-xl-none btn btn-sm"
        data-bs-toggle="offcanvas"
        href="#sidebar"
        role="button"
        aria-controls="sidebar"
      >
        <img
          src="../assets/icons/burger_menu.svg"
          alt="menu"
          style="width: 20px"
        />
      </a>
      <div class="fs-6 fw-bold secondary-text-color">Change Password</div>
    </div>

    <div class="text-center p-1 rounded-circle">
      <img src="../assets/sample_logo.png" alt="Logo" style="max-width: 50px" />
    </div>
  </div>
</div>

<div class="p-3 border shadow mt-4 rounded">
  <div class="d-grid mb-3 small">
    <div class="fs-6 fw-bold">Rules to change password:</div>
    <div>
      1. Length of password must be more than 4 characters and less than 26
      characters.
    </div>
    <div>2. Password should not be same as Login ID or Employee ID.</div>
  </div>

  <div class="p-3 mt-4 rounded">
    <div class="d-grid gap-3 mx-auto w-100 w-md-75 w-lg-50 my-3 p-2">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-12 col-md-10 col-lg-9 col-xl-8">
          <div class="form-floating mb-3">
            <input
              type="password"
              class="form-control password-field"
              id="old_password"
              placeholder="Old Password"
            />
            <label for="old_password">Old Password</label>
          </div>

          <div class="form-floating mb-3">
            <input
              type="password"
              class="form-control password-field"
              id="new_password"
              placeholder="New Password"
            />
            <label for="new_password">New Password</label>
          </div>

          <div class="form-floating mb-3">
            <input
              type="password"
              class="form-control password-field"
              id="retype_password"
              placeholder="Retype Password"
            />
            <label for="retype_password">Retype Password</label>
          </div>

          <div class="form-check mb-3">
            <input
              class="form-check-input"
              type="checkbox"
              id="show_password"
            />
            <label class="form-check-label" for="show_password">
              Show Password
            </label>
          </div>

          <div class="text-center">
            <button class="btn btn-sm primary-btn w-50">Save</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- jQuery -->
<script src="../jquery/jquery.js"></script>
<script>
  $(document).ready(function () {
    console.log("jQuery is working!");

    // Show/Hide password fields
    $("#show_password").on("change", function () {
      const isChecked = $(this).is(":checked");
      $(".password-field").attr("type", isChecked ? "text" : "password");
    });
  });
</script>
