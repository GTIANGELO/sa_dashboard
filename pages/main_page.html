<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Portal</title>
    <!-- bootstrap css -->
    <link
      href="../bootstrap/bootstrap-5.3.7-dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- custom css -->
    <link href="../style/custom_style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container-fluid vh-100">
      <div class="row justify-content-center align-items-center h-100">
        <!-- Sidebar Column -->
        <div class="col-lg-2 d-none d-lg-block p-0 shadow-sm">
          <div id="sidebar-container" class="h-100"></div>
        </div>

        <!-- Main Content Column -->
        <div
          class="col-12 col-lg-10 overflow-auto h-100"
          id="maincontent"
        ></div>
      </div>
    </div>

    <div
      class="offcanvas offcanvas-start"
      tabindex="-1"
      id="sidebar"
      aria-labelledby="sidebarLabel"
    >
      <!-- <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="sidebarLabel">Menu</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="offcanvas"
          aria-label="Close"
        ></button>
      </div> -->
      <div class="offcanvas-body p-0 m-0">
        <div id="sidebar-container-small" class=""></div>
      </div>
    </div>

    <!-- Modal -->
    <div
      class="modal fade"
      id="dataprivacymodal"
      tabindex="-1"
      aria-labelledby="switchaccountmodal"
      aria-hidden="true"
    >
      <div
        class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg"
      >
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="switchaccountmodal">
              Switch Account
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="border rounded p-2">
              <table class="table table-sm table-hover align-items-center">
                <thead>
                  <tr>
                    <th class="">Profile</th>
                    <th class="">ID Number</th>
                    <th class="">Fullname</th>
                    <th class="">Year and Term</th>
                    <th class="text-center">Action</th>
                  </tr>
                </thead>
                <tbody class="table-group-divider align-items-center">
                  <tr>
                    <td>
                      <img
                        class="rounded-circle border p-1"
                        src="../assets/image.png"
                        alt="Logo"
                        style="max-width: 50px"
                      />
                    </td>
                    <td>E-11965-14</td>
                    <td>Validad, Angelo F.</td>
                    <td>2024 - 2nd Term</td>
                    <td class="text-center">
                      <button class="btn btn-sm secondary-btn rounded-pill">
                        switch
                      </button>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <img
                        class="rounded-circle border p-1"
                        src="../assets/image.png"
                        alt="Logo"
                        style="max-width: 50px"
                      />
                    </td>
                    <td>E-234544-22</td>
                    <td>Dela Crux, Juan D.</td>
                    <td>2023 - 2nd Term</td>
                    <td class="text-center">
                      <button class="btn btn-sm secondary-btn rounded-pill">
                        switch
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-sm primary-btn"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- bootstrap javascript -->
    <script src="../bootstrap/bootstrap-5.3.7-dist/js/bootstrap.bundle.min.js"></script>

    <!-- Jquery -->
    <script src="../jquery/jquery.js"></script>
    <script>
      $(document).ready(function () {
        console.log("jQuery is working!");

        // Load normal sidebar (desktop, lg+)
        $("#sidebar-container").load("sidebar.html", function () {
          console.log("Sidebar loaded successfully for large screens!");
        });

        // Load offcanvas sidebar (sm/md)
        $("#sidebar-container-small").load("sidebar.html", function () {
          console.log("Sidebar loaded successfully in small screen sizes");

          // Rename all collapses and their triggers to avoid conflicts
          $("#sidebar-container-small .collapse").each(function () {
            let oldId = $(this).attr("id");
            let newId = oldId + "-sm";
            $(this).attr("id", newId);

            // Update matching trigger buttons (data-target, NOT data-bs-target)
            $('#sidebar-container-small [data-target="#' + oldId + '"]').attr(
              "data-target",
              "#" + newId
            );
          });
        });

        $("#maincontent").load("dashboard.html", function () {
          console.log("dashboard loaded successfully!");
        });

        $(document).on("click", "#switchaccountmodalbtn", function () {
          var offcanvasEl = document.querySelector("#sidebar"); // change ID to yours
