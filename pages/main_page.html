<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Portal</title>

    <!-- ✅ Security improvement: Content Security Policy -->
    <!-- <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    /> -->

    <!-- Bootstrap CSS -->
    <link
      href="../bootstrap/bootstrap-5.3.7-dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link href="../style/custom_style.css" rel="stylesheet" />
  </head>

  <body>
    <div class="container-fluid vh-100">
      <div class="row justify-content-center align-items-center h-100">
        <!-- Sidebar (desktop) -->
        <div
          class="col-sm-0 col-md-0 col-lg-0 col-xl-3 col-xxl-2 p-0 shadow-sm d-none d-xl-flex"
        >
          <div id="sidebar-container" class="h-100"></div>
        </div>

        <!-- Main content -->
        <div
          class="col-sm-12 col-md-12 col-lg-12 col-xl-9 col-xxl-10 overflow-auto h-100 border"
          id="maincontent"
        ></div>
      </div>
    </div>

    <!-- Offcanvas (small screens) -->
    <div
      class="offcanvas offcanvas-start"
      tabindex="-1"
      id="sidebar"
      aria-labelledby="sidebarLabel"
    >
      <div class="offcanvas-body p-0 m-0">
        <div id="sidebar-container-small"></div>
      </div>
    </div>

    <!-- Modal -->
    <div
      class="modal fade"
      id="dataprivacymodal"
      tabindex="-1"
      aria-labelledby="dataprivacymodalLabel"
      aria-hidden="true"
    >
      <div
        class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg"
      >
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-6" id="dataprivacymodalLabel">
              Switch Account
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div style="max-height: 350px; overflow-y: auto">
              <div class="table-responsive">
                <table
                  class="table table-sm table-striped table-hover table-fixed"
                >
                  <thead>
                    <tr>
                      <th style="width: 100px"></th>
                      <th style="width: 100px">ID Number</th>
                      <th style="width: 100px">Fullname</th>
                      <th style="width: 100px">Action</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td class="text-center">
                        <img
                          class="rounded-circle border shadow-sm w-50 w-lg-100 mx-lg-auto"
                          src="../assets/image.png"
                          alt="Logo"
                          style="max-width: 50px"
                        />
                      </td>
                      <td>E-11965-14</td>
                      <td>Validad, Angelo F.</td>
                      <td>
                        <button class="btn btn-sm primary-btn" disabled>
                          switch
                        </button>
                      </td>
                    </tr>
                    <tr>
                      <td class="text-center">
                        <img
                          src="../assets/sample_logo.png"
                          alt="Logo"
                          style="max-width: 50px"
                        />
                      </td>
                      <td>E-23455-15</td>
                      <td>Validad, Jhon F.</td>
                      <td>
                        <button class="btn btn-sm primary-btn">switch</button>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-sm btn-danger"
              data-bs-dismiss="modal"
            >
              Close
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="../bootstrap/bootstrap-5.3.7-dist/js/bootstrap.bundle.min.js"></script>

    <!-- jQuery -->
    <script src="../jquery/jquery.js"></script>

    <script>
      $(document).ready(function () {
        console.log("✅ jQuery initialized");

        $.get("sidebar.html", function (data) {
          // Insert sidebar into both containers
          $("#sidebar-container").html(data);
          $("#sidebar-container-small").html(data);

          // Fix duplicate collapse IDs in small sidebar
          $("#sidebar-container-small .collapse").each(function () {
            const oldId = $(this).attr("id");
            const newId = oldId + "-sm";
            $(this).attr("id", newId);
            $('#sidebar-container-small [data-target="#' + oldId + '"]').attr(
              "data-target",
              "#" + newId
            );
          });

          // Highlight menu after sidebar loads
          highlightActiveMenu();
        });

        const menuMap = {
          "#dashboard": "dashboard.html",
          "#studentclearance": "student_clearance.html",
          "#onlineadvising": "online_advising.html",
          "#recorddownpayment": "record_downpayment.html",
          "#submitadmissionrequirement": "submit_admission_requirement.html",
          "#subjectenrolled": "subject_enrolled.html",
          "#enrolledloadschedule": "enrolled_load_schedule.html",
          "#feespaidduringenrollment": "fees_paid_during_enrollment.html",
          "#ledger": "ledger.html",
          "#periodicdues": "periodic_dues.html",
          "#recordtuitionpayment": "record_tuition_payment.html",
          "#checklist": "check_list.html",
          "#classassignment": "class_assignment.html",
          "#classattendance": "class_attendance.html",
          "#campusattendance": "campus_attendance.html",
          "#awardsachievementsacad": "awards_achievements_acad.html",
          "#filedworkprofileojt": "field_work_profile_ojt.html",
          "#gradingperexamperiod": "grading_per_exam_period.html",
          "#membership": "membership.html",
          "#awardsachievementsnonacad": "awards_achievements_non_acad.html",
          "#editpersonalinfo": "edit_personal_info.html",
          "#viewpersonalinfo": "view_personal_info.html",
          "#printpersonalinfo": "print_personal_info.html",
          "#changepassword": "change_password.html",
          "#library": "library.html",
          "#facultyevaluation": "faculty_evaluation.html",
        };

        // Validate stored page before loading
        const allowedPages = Object.values(menuMap);
        const storedPage = localStorage.getItem("activePage");
        const lastPage = allowedPages.includes(storedPage)
          ? storedPage
          : "dashboard.html";

        const pageCache = {};

        function loadPage(pageFile, menuId) {
          if (pageCache[pageFile]) {
            $("#maincontent").html(pageCache[pageFile]);
            finalizeLoad(pageFile, menuId);
          } else {
            $.get(pageFile, function (data) {
              pageCache[pageFile] = data;
              $("#maincontent").html(data);
              finalizeLoad(pageFile, menuId);
            });
          }
        }

        function finalizeLoad(pageFile, menuId) {
          localStorage.setItem("activePage", pageFile);
          localStorage.setItem("activeMenu", menuId);
          highlightActiveMenu();
        }

        // Load last page or dashboard
        loadPage(lastPage, localStorage.getItem("activeMenu"));

        $(document).on("click", Object.keys(menuMap).join(","), function () {
          const menuId = "#" + this.id;
          const pageFile = menuMap[menuId];
          loadPage(pageFile, menuId);
        });

        $(document).on("click", "#logout", function () {
          localStorage.clear();
          window.location.href = "../index.html";
        });

        $(document).on("click", "#switchaccountmodalbtn", function () {
          const offcanvasEl = document.querySelector("#sidebar");
          const offcanvas = bootstrap.Offcanvas.getInstance(offcanvasEl);
          if (offcanvas) offcanvas.hide();
        });

        function highlightActiveMenu() {
          const activeMenu = localStorage.getItem("activeMenu");
          if (!activeMenu) return;

          // Clear previous active states
          $(
            "#sidebar-container .active, #sidebar-container-small .active"
          ).removeClass("active");

          // Apply to main sidebar
          const $main = $("#sidebar-container " + activeMenu);
          if ($main.length) {
            $main.addClass("active");
            const $collapse = $main.closest(".collapse");
            if ($collapse.length) {
              $collapse.addClass("show");
              $('[data-target="#' + $collapse.attr("id") + '"]').addClass(
                "active"
              );
            }
          }

          // Apply to small sidebar
          const $small = $("#sidebar-container-small " + activeMenu);
          if ($small.length) {
            $small.addClass("active");
            const $collapseSm = $small.closest(".collapse");
            if ($collapseSm.length) {
              $collapseSm.addClass("show");
              $('[data-target="#' + $collapseSm.attr("id") + '"]').addClass(
                "active"
              );
            }
          }
        }

        // Refresh highlight when offcanvas opens
        $(document).on("shown.bs.offcanvas", "#sidebar", highlightActiveMenu);
      });
    </script>
  </body>
</html>
